name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # unity-test-runner publishes results as a check run

jobs:
  test:
    name: ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-test-

      - name: Check the Unity licence secrets (fails fast, so a bad secret never locks the Unity account)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          ok=1
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is empty. Add the whole content of Unity_lic.ulf as a repository secret (Settings > Secrets and variables > Actions)."; ok=0
          else
            case "$UNITY_LICENSE" in *"<root"*) ;; *) echo "::error::UNITY_LICENSE does not look like a .ulf licence file (no <root> element)."; ok=0;; esac
          fi
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is empty."; ok=0; continue; fi
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name contains a line break: paste the value on one line with nothing after it."; ok=0;; esac
            case "$value" in [[:space:]]*|*[[:space:]]) echo "::error::$name starts or ends with whitespace: re-create the secret without it."; ok=0;; esac
          done
          case "$UNITY_EMAIL" in *@*.*) ;; *) echo "::error::UNITY_EMAIL is not an email address."; ok=0;; esac
          [ "$ok" = 1 ] || { echo "::error::Unity activation was not attempted; nothing was sent to Unity."; exit 1; }
          echo "Unity secrets present and well-formed."

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
