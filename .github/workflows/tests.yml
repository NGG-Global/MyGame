name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # unity-test-runner publishes results as a check run

jobs:
  test:
    name: ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-test-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
