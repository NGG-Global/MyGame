name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      development:
        description: 'Development build (diagnostics overlays; the APK also carries x86_64 and is launch-tested on an Android emulator)'
        type: boolean
        default: false

# A newer push cancels the older build/deploy.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_NAME: OpenSkies

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            buildMethod: OpenSkies.Editor.BuildScript.BuildWebGL
          - targetPlatform: Android
            buildMethod: OpenSkies.Editor.BuildScript.BuildAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0 # semantic versioning reads git history

      - name: Free disk space (the Unity images are large; the WebGL job ran out of disk while pulling)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-

      - name: Check the Unity licence secrets (fails fast, so a bad secret never locks the Unity account)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          ok=1
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is empty. Add the whole content of Unity_lic.ulf as a repository secret (Settings > Secrets and variables > Actions)."; ok=0
          else
            case "$UNITY_LICENSE" in *"<root"*) ;; *) echo "::error::UNITY_LICENSE does not look like a .ulf licence file (no <root> element)."; ok=0;; esac
          fi
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is empty."; ok=0; continue; fi
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name contains a line break: paste the value on one line with nothing after it."; ok=0;; esac
            case "$value" in [[:space:]]*|*[[:space:]]) echo "::error::$name starts or ends with whitespace: re-create the secret without it."; ok=0;; esac
          done
          case "$UNITY_EMAIL" in *@*.*) ;; *) echo "::error::UNITY_EMAIL is not an email address."; ok=0;; esac
          [ "$ok" = 1 ] || { echo "::error::Unity activation was not attempted; nothing was sent to Unity."; exit 1; }
          echo "Unity secrets present and well-formed."

      - name: Build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: ${{ matrix.buildMethod }}
          buildName: ${{ env.BUILD_NAME }}
          customParameters: ${{ inputs.development && '-developmentBuild -androidX86_64' || '' }}

      - name: Upload APK
        if: matrix.targetPlatform == 'Android'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}-android-apk
          path: build/Android/${{ env.BUILD_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebGL for GitHub Pages
        if: matrix.targetPlatform == 'WebGL'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/WebGL/${{ env.BUILD_NAME }}

  deploy:
    name: Deploy WebGL to GitHub Pages
    needs: build
    # Deploy even if only the Android leg failed; deploy-pages fails on its own if no WebGL artifact exists.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Development builds only: install the APK on an Android emulator, launch it, and watch it for 90 s.
  # Fails if the app is not running at the end, dies (fatal signal or exception), reads its scene as
  # corrupted, or has a missing script. The logcat, screenshots and launch log are an artifact.
  launch-test:
    name: Launch test (Android emulator)
    needs: build
    if: ${{ !cancelled() && inputs.development }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE: com.dor.openskies
      SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}-android-apk
          path: apk

      - name: Enable hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator (API 34, x86_64)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "$SYSTEM_IMAGE" > /dev/null
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n launch -k "$SYSTEM_IMAGE" -d pixel_6 --force
          nohup "$SDK/emulator/emulator" -avd launch -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 > emulator.log 2>&1 &
          "$SDK/platform-tools/adb" wait-for-device
          timeout 600 bash -c 'until [ "$('"$SDK"'/platform-tools/adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          "$SDK/platform-tools/adb" shell settings put global window_animation_scale 0
          echo "Emulator booted."

      - name: Install, launch and watch the app for 90 s
        run: |
          mkdir -p launch
          adb install -r apk/*.apk
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > /dev/null
          alive=1
          for t in 15 30 60 90; do
            sleep $(( t - ${last:-0} )); last=$t
            adb exec-out screencap -p > "launch/screen-${t}s.png" || true
            if [ -z "$(adb shell pidof "$PACKAGE" | tr -d '\r')" ]; then echo "::error::The app is not running ${t} s after launch."; alive=0; break; fi
            echo "Running at ${t} s."
          done
          adb logcat -d -v threadtime > launch/logcat.txt
          adb pull "/sdcard/Android/data/$PACKAGE/files/openskies-launch.log" launch/ > /dev/null 2>&1 || true
          echo "::group::Unity, crash and runtime lines"
          grep -E ' (Unity|AndroidRuntime|DEBUG|libc|CRASH|crash_dump64|ActivityManager)\s*:' launch/logcat.txt | grep -v 'ActivityManager.*Start proc' | tail -400 || true
          echo "::endgroup::"
          fail=0
          [ "$alive" = 1 ] || fail=1
          for pattern in 'Fatal signal' 'FATAL EXCEPTION' 'is corrupted' 'referenced script .* is missing'; do
            if grep -qE "$pattern" launch/logcat.txt; then echo "::error::Logcat contains '$pattern':"; grep -E "$pattern" launch/logcat.txt | head -5; fail=1; fi
          done
          echo "Unity errors and exceptions in the log: $(grep -cE ' E Unity\s*:|Exception' launch/logcat.txt || true)"
          exit $fail

      - name: Upload the launch log and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-test
          path: |
            launch
            emulator.log
          if-no-files-found: warn
          retention-days: 14
