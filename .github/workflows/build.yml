name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      development:
        description: 'Development build (shows telemetry and touch diagnostics overlays)'
        type: boolean
        default: false

# A newer push cancels the older build/deploy.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_NAME: OpenSkies

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            buildMethod: OpenSkies.Editor.BuildScript.BuildWebGL
          - targetPlatform: Android
            buildMethod: OpenSkies.Editor.BuildScript.BuildAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0 # semantic versioning reads git history

      - name: Free disk space (the Unity images are large; the WebGL job ran out of disk while pulling)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-

      - name: Check the Unity licence secrets (fails fast, so a bad secret never locks the Unity account)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          ok=1
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is empty. Add the whole content of Unity_lic.ulf as a repository secret (Settings > Secrets and variables > Actions)."; ok=0
          else
            case "$UNITY_LICENSE" in *"<root"*) ;; *) echo "::error::UNITY_LICENSE does not look like a .ulf licence file (no <root> element)."; ok=0;; esac
          fi
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is empty."; ok=0; continue; fi
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name contains a line break: paste the value on one line with nothing after it."; ok=0;; esac
            case "$value" in [[:space:]]*|*[[:space:]]) echo "::error::$name starts or ends with whitespace: re-create the secret without it."; ok=0;; esac
          done
          case "$UNITY_EMAIL" in *@*.*) ;; *) echo "::error::UNITY_EMAIL is not an email address."; ok=0;; esac
          [ "$ok" = 1 ] || { echo "::error::Unity activation was not attempted; nothing was sent to Unity."; exit 1; }
          echo "Unity secrets present and well-formed."

      - name: Build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: ${{ matrix.buildMethod }}
          buildName: ${{ env.BUILD_NAME }}
          customParameters: ${{ inputs.development && '-developmentBuild' || '' }}

      - name: Upload APK
        if: matrix.targetPlatform == 'Android'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}-android-apk
          path: build/Android/${{ env.BUILD_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebGL for GitHub Pages
        if: matrix.targetPlatform == 'WebGL'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/WebGL/${{ env.BUILD_NAME }}

  deploy:
    name: Deploy WebGL to GitHub Pages
    needs: build
    # Deploy even if only the Android leg failed; deploy-pages fails on its own if no WebGL artifact exists.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
